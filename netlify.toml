# Publicação no Netlify (site de demonstração).
# O site React é compilado na pasta app; as rotas de IA viram a função app/netlify/functions/api.mjs.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Site de demonstração: usa o projeto Firebase de demonstração, nunca o de produção.
  VITE_AMBIENTE = "staging"

# Rotas de IA -> função (precisa vir antes da regra do React).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Rotas do React (/restaurantes, /minha-conta...) abrem direto pelo link.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
