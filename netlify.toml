# Publicação no Netlify (site de demonstração).
# O site React é compilado na pasta app; as rotas de IA viram a função app/netlify/functions/api.mjs.
[build]
  base = "app"
  command = "npm run build"
  publish = "app/dist"
  functions = "app/netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Site de demonstração: usa o projeto Firebase de demonstração, nunca o de produção.
  VITE_AMBIENTE = "staging"

# Rotas de IA -> função (precisa vir antes da regra do React).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Endereços do sistema antigo (/legado/...) -> telas novas (mesma tabela de app/server/legado.js).

# As regras com ?id= vêm antes das sem parâmetro.

[[redirects]]
  from = "/legado/cadastro.html"
  to = "/cadastro?tipo=restaurante"
  status = 302
  query = {tipo = "restaurante"}
  force = true

[[redirects]]
  from = "/legado/pagina-restaurante.html"
  to = "/restaurantes/:id"
  status = 302
  query = {id = ":id"}
  force = true

[[redirects]]
