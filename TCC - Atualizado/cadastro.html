<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar Conta — GastroMatch</title>

    <!-- Tailwind CSS v4 CDN -->
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>

    <!-- CSS local do projeto -->
    <link rel="stylesheet" href="styles.css">

    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&amp;family=Inter:wght@400;500;600&amp;display=swap">
</head>

<body class="min-h-screen bg-cream text-ink font-body antialiased flex flex-col justify-between">

    <!-- Header Mínimo -->
    <header class="mx-auto max-w-6xl w-full px-5 sm:px-8">
        <nav class="flex items-center justify-between py-6">
            <a href="index.html" class="font-display font-semibold text-2xl tracking-tight">GastroMatch<span class="text-terra">.</span></a>
            <a href="index.html" class="text-xs font-semibold uppercase tracking-wider text-inksoft hover:text-terra transition-colors">
                Voltar para o início
            </a>
        </nav>
    </header>

    <!-- Conteúdo Centralizado de Cadastro -->
    <main class="mx-auto max-w-lg w-full px-5 py-8">

        <div class="rounded-[28px] bg-paper p-8 sm:p-10 ring-1 ring-ink/5 shadow-clay">

            <!-- Cabeçalho do Card -->
            <div class="text-center mb-6">
                <h1 class="font-display font-semibold text-3xl text-ink">Crie a sua conta</h1>
                <p class="mt-2 text-sm text-inksoft">Junte-se ao GastroMatch e aproveite ofertas exclusivas</p>
            </div>

            <!-- Seletores do Tipo de Conta -->
            <div class="flex rounded-2xl bg-cream p-1 ring-1 ring-ink/10 mb-6">
                <button type="button" id="btn-tipo-cliente" class="flex-1 py-2.5 text-xs font-semibold rounded-xl bg-terra text-cream shadow-sm transition-all cursor-pointer">
                    Para Usuários
                </button>
                <button type="button" id="btn-tipo-restaurante" class="flex-1 py-2.5 text-xs font-semibold rounded-xl text-inksoft hover:text-ink transition-all cursor-pointer">
                    Restaurante Parceiro
                </button>
            </div>

            <!-- Formulário de Cadastro -->
            <form id="form-cadastro" class="space-y-4">
                <input type="hidden" id="tipo-conta" value="cliente">

                <!-- Nome / Nome Responsável -->
                <div>
                    <label id="label-nome" for="nome" class="block text-xs font-semibold text-ink mb-1.5">Nome Completo</label>
                    <input type="text" id="nome" required placeholder="Digite o seu nome completo" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                </div>

                <!-- Documento (CPF / CNPJ) -->
                <div>
                    <label id="label-doc" for="documento" class="block text-xs font-semibold text-ink mb-1.5">CPF (Apenas números)</label>
                    <input type="text" id="documento" required placeholder="000.000.000-00" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                </div>

                <!-- Campos Exclusivos para Restaurante -->
                <div id="campos-restaurante" class="hidden space-y-4">
                    <div>
                        <label for="nomeRestaurante" class="block text-xs font-semibold text-ink mb-1.5">Nome do Restaurante</label>
                        <input type="text" id="nomeRestaurante" placeholder="Ex: Trattoria Lume" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                    </div>
                    <div>
                        <label for="telefone" class="block text-xs font-semibold text-ink mb-1.5">Telefone de Contacto</label>
                        <input type="text" id="telefone" placeholder="(61) 99999-9999" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                    </div>
                </div>

                <!-- E-mail -->
                <div>
                    <label for="email" class="block text-xs font-semibold text-ink mb-1.5">E-mail</label>
                    <input type="email" id="email" required placeholder="seu@email.com" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                </div>

                <!-- Senha -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-ink mb-1.5">Senha</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres" class="w-full rounded-2xl bg-cream px-4 py-3 text-sm text-ink placeholder:text-inksoft/60 ring-1 ring-ink/10 focus:outline-none focus:ring-2 focus:ring-terra/40">
                </div>

                <!-- Botão de Submissão -->
                <button type="submit" class="w-full mt-2 inline-flex items-center justify-center rounded-2xl bg-terra text-cream font-semibold text-sm py-3.5 px-6 ring-1 ring-terradeep/30 hover:bg-terradeep transition-colors cursor-pointer shadow-sm">
                    Finalizar Cadastro
                </button>

            </form>

            <!-- Rodapé do Card (Link Login) -->
            <div class="mt-8 pt-6 border-t border-ink/10 text-center">
                <p class="text-xs text-inksoft">
                    Já tem uma conta?
                    <a href="login.html" class="font-semibold text-terra hover:underline">Entre aqui</a>
                </p>
            </div>

        </div>

    </main>

    <!-- Footer GastroMatch -->
    <footer class="w-full pt-8 pb-10 mt-auto">
        <div class="mx-auto max-w-6xl px-5 sm:px-8">
            <div class="border-t border-ink/10 pt-6 text-center text-xs text-inksoft">
                <p>© 2026 GastroMatch. Todos os direitos reservados.</p>
            </div>
        </div>
    </footer>

    <!-- SCRIPT DE CRIAÇÃO DE CONTA -->
    <script type="module">
        import { auth, db } from './firebase-config.js';
        import { createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const btnCliente = document.getElementById('btn-tipo-cliente');
        const btnRestaurante = document.getElementById('btn-tipo-restaurante');
        const tipoContaInput = document.getElementById('tipo-conta');
        const labelNome = document.getElementById('label-nome');
        const labelDoc = document.getElementById('label-doc');
        const camposRestaurante = document.getElementById('campos-restaurante');
        const formCadastro = document.getElementById('form-cadastro');

        // Deteta parâmetro na URL se veio de "Cadastrar Restaurante"
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tipo') === 'restaurante') {
            ativarAbaRestaurante();
        }

        btnCliente.addEventListener('click', ativarAbaCliente);
        btnRestaurante.addEventListener('click', ativarAbaRestaurante);

        function ativarAbaCliente() {
            tipoContaInput.value = 'cliente';
            btnCliente.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-terra text-cream shadow-sm transition-all cursor-pointer";
            btnRestaurante.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl text-inksoft hover:text-ink transition-all cursor-pointer";
            labelNome.textContent = "Nome Completo";
            labelDoc.textContent = "CPF (Apenas números)";
            camposRestaurante.classList.add('hidden');
        }

        function ativarAbaRestaurante() {
            tipoContaInput.value = 'restaurante';
            btnRestaurante.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl bg-terra text-cream shadow-sm transition-all cursor-pointer";
            btnCliente.className = "flex-1 py-2.5 text-xs font-semibold rounded-xl text-inksoft hover:text-ink transition-all cursor-pointer";
            labelNome.textContent = "Nome do Responsável";
            labelDoc.textContent = "CNPJ (Apenas números)";
            camposRestaurante.classList.remove('hidden');
        }

        formCadastro.addEventListener('submit', async (e) => {
            e.preventDefault();

            const tipo = tipoContaInput.value;
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const nome = document.getElementById('nome').value.trim();
            const documento = document.getElementById('documento').value.replace(/\D/g, '');

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                let dadosUsuario = {
                    email: email,
                    tipo: tipo,
                    status: 'ativo',
                    criadoEm: new Date()
                };

                if (tipo === 'restaurante') {
                    dadosUsuario.nomeResponsavel = nome;
                    dadosUsuario.cnpj = documento;
                    dadosUsuario.nomeRestaurante = document.getElementById('nomeRestaurante').value.trim();
                    dadosUsuario.telefone = document.getElementById('telefone').value.trim();
                } else {
                    dadosUsuario.nome = nome;
                    dadosUsuario.cpf = documento;
                }

                await setDoc(doc(db, "usuarios", user.uid), dadosUsuario);

                alert("Conta criada com sucesso!");
                if (tipo === 'restaurante') {
                    window.location.href = "painel-restaurante.html";
                } else {
                    window.location.href = "index.html";
                }

            } catch (error) {
                console.error("Erro ao cadastrar:", error);
                alert("Erro ao criar conta: " + error.message);
            }
        });
    </script>

</body>

</html>
